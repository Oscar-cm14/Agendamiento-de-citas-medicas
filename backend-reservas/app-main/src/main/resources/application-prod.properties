# ══════════════════════════════════════════════════════════════════════════
#  PERFIL DE PRODUCCIÓN — Render + Azure Keycloak
#  Activo cuando SPRING_PROFILES_ACTIVE=prod
#  Todas las URLs y secretos se inyectan como variables de entorno en Render
# ══════════════════════════════════════════════════════════════════════════

# ── Base de datos PostgreSQL (Render) ─────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# ── JPA / Hibernate ───────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true

# ── Consola H2 deshabilitada en prod ──────────────────────────────────────
spring.h2.console.enabled=false

# ── Seguridad OAUTH2 / JWT (Keycloak en Azure) ────────────────────────────
# Valor: https://<tu-contenedor>.azurecontainer.io/realms/clinica-realm
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}

# ── Keycloak Admin API ────────────────────────────────────────────────────
# Valor: https://<tu-contenedor>.azurecontainer.io
keycloak.admin.server-url=${KEYCLOAK_SERVER_URL}
keycloak.admin.realm=clinica-realm
keycloak.admin.client-id=admin-cli
keycloak.admin.username=admin
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD}
keycloak.client-id=clinica-frontend

# ── Logging (menos verbose en prod) ───────────────────────────────────────
logging.level.root=WARN
logging.level.com.clinica=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ── Notificaciones ────────────────────────────────────────────────────────
clinica.nombre=Clinica Piedra Azul

notification.email.enabled=false
notification.email.from=${SPRING_MAIL_USERNAME}

# Agregar estas líneas:
#spring.mail.host=
#spring.mail.port=
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
#spring.mail.username=${SPRING_MAIL_USERNAME}
#spring.mail.password=${SPRING_MAIL_PASSWORD}
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
#spring.mail.properties.mail.smtp.starttls.required=true

notification.whatsapp.enabled=true
twilio.whatsapp.from=whatsapp:+14155238886
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}

# ── Actuator ──────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ── JMX (deshabilitado en prod) ───────────────────────────────────────────
spring.jmx.enabled=false
spring.application.admin.enabled=false
