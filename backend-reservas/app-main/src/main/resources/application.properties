spring.application.name=backend-reservas

# ══════════════════════════════════════════════════════════════════════════
#  MONITOREO — Spring Boot Actuator
# ══════════════════════════════════════════════════════════════════════════

# ── Endpoints expuestos ───────────────────────────────────────────────────
# health:  GET /actuator/health  → ¿está el backend vivo?
# info:    GET /actuator/info    → versión y datos de la app
# metrics: GET /actuator/metrics → métricas JVM, memoria, HTTP
management.endpoints.web.exposure.include=health,info,metrics

# ── Mostrar detalles del health (BD, disco, etc.) ─────────────────────────
management.endpoint.health.show-details=always

# ── Información de la aplicación (aparece en /actuator/info) ─────────────
info.app.name=Agendamiento de Citas Médicas
info.app.description=Sistema de agendamiento para Clínica Piedra Azul
info.app.version=1.0.0

# ══════════════════════════════════════════════════════════════════════════
#  LOGGING — Registro centralizado de logs
# ══════════════════════════════════════════════════════════════════════════

# Nivel general de logs
logging.level.root=INFO

# Logs detallados del código propio (útil para debug)
logging.level.com.clinica=DEBUG

# Ocultar logs de librerías de terceros (reduce ruido)
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Formato del log: fecha + nivel + clase + mensaje
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n

# Guardar logs en archivo (útil para producción y revisión)
logging.file.name=logs/clinica-backend.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# ── Base de datos H2 (archivo persistente) ────────────────────────────────
spring.datasource.url=jdbc:h2:file:./data/clinica_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── Consola H2 ────────────────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ───────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true

# ── Jackson ───────────────────────────────────────────────────────────────
spring.jackson.default-property-inclusion=always
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Seguridad OAUTH2 / JWT (Keycloak) ────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/clinica-realm

# ── Keycloak Admin API (crea usuarios automaticamente al registrarlos) ────
keycloak.admin.server-url=http://localhost:8081
keycloak.admin.realm=clinica-realm
keycloak.admin.client-id=admin-cli
keycloak.admin.username=admin
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}

keycloak.client-id=clinica-frontend

# ══════════════════════════════════════════════════════════════════════════
#  NOTIFICACIONES
# ══════════════════════════════════════════════════════════════════════════
 
# ── Nombre que aparece en los mensajes al paciente ────────────────────────
clinica.nombre=clinica piedra azul
 
# ── CORREO REAL (Gmail) ───────────────────────────────────────────────────
notification.email.enabled=true
notification.email.from=${SPRING_MAIL_USERNAME:}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── WHATSAPP SANDBOX (Twilio) ─────────────────────────────────────────────
notification.whatsapp.enabled=true
twilio.whatsapp.from=whatsapp:+14155238886
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}