spring.application.name=backend-reservas

# ── Base de datos H2 (archivo persistente) ────────────────────────────────
spring.datasource.url=jdbc:h2:file:./data/clinica_db
# Configuración de la base de datos H2 en memoria / archivo local
spring.datasource.url=jdbc:h2:file:./data/clinica_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── Consola H2 ────────────────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ───────────────────────────────────────────────────────
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true

# ── Jackson ───────────────────────────────────────────────────────────────
spring.jackson.default-property-inclusion=always
spring.jackson.default-property-inclusion=always

# Seguridad OAUTH2 / JWT (Keycloak)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/clinica-realm
