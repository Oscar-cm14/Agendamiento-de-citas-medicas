# ── BD H2 en memoria ──────────────────────────────────────────────────────────
# NON_KEYWORDS evita conflictos con palabras reservadas de H2 (USER, USERS, etc.)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER,USERS,VALUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# ── JWT: usar jwk-set-uri en lugar de issuer-uri ──────────────────────────────
# issuer-uri intenta conectarse a Keycloak al arrancar → falla en tests
# jwk-set-uri NO hace auto-discovery, y además es sobreescrito por TestSecurityConfig
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/clinica-realm/protocol/openid-connect/certs

# ── Keycloak Admin (valores ficticios, el servicio se mockea) ─────────────────
keycloak.admin.server-url=http://localhost:8081
keycloak.admin.realm=clinica-realm
keycloak.admin.client-id=admin-cli
keycloak.admin.username=admin
keycloak.admin.password=admin
keycloak.client-id=clinica-frontend

# ── Mail: desactivar auto-configuración real ──────────────────────────────────
# Sin esto JavaMailSender intenta conectarse a SMTP y falla
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration,org.springframework.boot.autoconfigure.mail.MailSenderValidatorAutoConfiguration

# ── Notificaciones desactivadas ───────────────────────────────────────────────
notification.email.enabled=false
notification.whatsapp.enabled=false
twilio.account-sid=ACTEST00000000000000000000000000000
twilio.auth-token=testtoken000000000000000000000000
twilio.whatsapp.from=whatsapp:+14155238886
clinica.nombre=Clinica Test
