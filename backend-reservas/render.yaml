services:
  # ── Backend Spring Boot ──────────────────────────────────────────────────
  - type: web
    name: agendamiento-de-citas-medicas
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon

    # Variables de entorno — completa los valores en el dashboard de Render
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Base de datos — se rellena automáticamente si usas el DB de abajo
      - key: DATABASE_URL
        fromDatabase:
          name: clinica-db
          property: connectionString

      - key: DATABASE_USERNAME
        fromDatabase:
          name: clinica-db
          property: user

      - key: DATABASE_PASSWORD
        fromDatabase:
          name: clinica-db
          property: password

      # Keycloak en Azure — reemplaza con tu URL real después de desplegar
      - key: KEYCLOAK_SERVER_URL
        value: https://REEMPLAZAR-CON-TU-URL-AZURE.azurecontainer.io

      - key: KEYCLOAK_ISSUER_URI
        value: https://REEMPLAZAR-CON-TU-URL-AZURE.azurecontainer.io/realms/clinica-realm

      - key: KEYCLOAK_ADMIN_PASSWORD
        sync: false   # se ingresa manualmente en el dashboard (secreto)

      # Frontend Vercel — para CORS
      - key: FRONTEND_URL
        value: https://agendamiento-de-citas-medicas.vercel.app

      # Correo Gmail
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false

      # Twilio WhatsApp
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false

    healthCheckPath: /actuator/health

databases:
  # ── PostgreSQL gratuito ──────────────────────────────────────────────────
  - name: clinica-db
    plan: free
    region: oregon
    databaseName: clinica
    user: clinica_user
