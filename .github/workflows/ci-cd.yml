# =============================================================================
# CI/CD Pipeline — Agendamiento de Citas Médicas
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  # ===========================================================================
  # JOB 1: CI BACKEND — Compilar y ejecutar todos los tests
  # ===========================================================================
  ci-backend:
    name: "CI — Backend (Spring Boot + Tests)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar backend
        working-directory: backend-reservas
        run: mvn clean package -DskipTests -B

      - name: Ejecutar tests
        working-directory: backend-reservas
        run: mvn test -B
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Publicar reporte de tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-tests-backend
          path: backend-reservas/**/target/surefire-reports/
          retention-days: 7

      - name: Guardar JAR compilado
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: backend-jar
          path: backend-reservas/app-main/target/*.jar
          retention-days: 1

  # ===========================================================================
  # JOB 2: CI FRONTEND — Compilar Angular
  # ===========================================================================
  ci-frontend:
    name: "CI — Frontend (Angular)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend-angular
        run: npm ci

      - name: Compilar Angular (producción)
        working-directory: frontend-angular
        run: npm run build -- --configuration production

      - name: Guardar build del frontend
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-dist
          path: frontend-angular/dist/
          retention-days: 1

  # ===========================================================================
  # JOB 3: CD — Deploy en Render (solo en push a main)
  # ===========================================================================
  cd-deploy-backend:
    name: "CD — Deploy Backend en Render"
    runs-on: ubuntu-latest
    needs: [ ci-backend, ci-frontend ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger deploy en Render
        run: |
          echo "Desplegando versión: ${{ github.sha }}"
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
              -H "Accept: application/json" || echo "Deploy hook ejecutado"
          else
            echo "RENDER_DEPLOY_HOOK_URL no configurado aún - despliegue manual requerido"
          fi

  # ===========================================================================
  # JOB 4: CD — Frontend en Vercel (se despliega automáticamente)
  # ===========================================================================
  cd-deploy-frontend:
    name: "CD — Deploy Frontend en Vercel"
    runs-on: ubuntu-latest
    needs: [ ci-backend, ci-frontend ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Confirmar deploy en Vercel
        run: echo "Vercel detecta el push a main automáticamente y redespliega el frontend."
